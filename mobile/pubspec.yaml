name: ssd_image_capture
description: Offline-first field photo capture and sync.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.1
  geolocator: ^13.0.2
  geocoding: ^5.0.0
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.0
  connectivity_plus: ^6.1.1
  flutter_image_compress: ^2.4.0
  http: ^1.2.2
  http_parser: ^4.1.2
  uuid: ^4.5.1
  intl: ^0.19.0
  mobile_scanner: ^7.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/ca.pem
